# =============================================================================
# PRODUCTION environment.
#
# Remote/managed database (default):
#   docker compose -f docker-compose.prod.yml up -d --build
#   -> set DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD in .env to your remote DB.
#
# Dockerized MySQL instead:
#   docker compose -f docker-compose.prod.yml --profile db-local up -d --build
#   -> set DB_HOST=mysql-local in .env (the mysql-local service name).
#   (or set COMPOSE_PROFILES=db-local in .env so plain `up -d` also starts it)
#
# Same bind-mount design as dev (see docker-compose.yml for the full
# rationale): the project directory is mounted into the containers so
# `git pull` + `docker compose up -d` picks up new code with no rebuild;
# only vendor/ and node_modules/ live in named volumes for I/O performance.
#
# Project name, image tag and container names below are all suffixed/scoped
# distinctly from docker-compose.yml (dev) on purpose (RISK-OPS-006,
# NFR-SEC-005, ADR installer-deploy_docker-dev-prod-safeguards): running the
# dev compose file by mistake on a host that's already running this prod
# stack can, at worst, start an unrelated dev stack alongside it (or fail on
# a port conflict) - it can no longer silently stop/replace a running prod
# container or overwrite the prod image, which is what happened before this
# was scoped per-environment (see DOCKER.md).
# =============================================================================

name: scart-prod

services:
  app:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
        INSTALL_XDEBUG: "false"
    image: scart-app:${PHP_VERSION:-8.3}-prod
    container_name: scart-app-prod
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    # Only variables entrypoint.sh's shell logic needs (DB wait-loop) plus
    # Docker-specific overrides go here. Deliberately NOT `env_file: .env` -
    # that would inject the whole .env (including APP_KEY etc.) as frozen
    # container env vars, which phpdotenv then refuses to ever overwrite from
    # the .env file again (even after `artisan key:generate` updates it).
    # Laravel reads the rest of .env itself on every request, no forwarding
    # needed.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Default REMOTE_ADDR trusts exactly one hop: the "webserver" (nginx)
      # container this compose file itself ships ("app" has no published
      # port, nginx is always its only direct peer) - it's a literal
      # sentinel Illuminate\Http\Middleware\TrustProxies substitutes with
      # the request's actual immediate peer at runtime, and it makes
      # X-Forwarded-Proto work (HTTPS URL generation). Deployments that
      # additionally sit behind an external CDN/LB (Cloudflare, GCP/AWS
      # LB...) must ALSO trust that edge's IP ranges or request()->ip()
      # stops at the edge's own hop in X-Forwarded-For and returns the
      # edge's IP instead of the visitor's: set TRUSTED_PROXIES in .env
      # (compose interpolates it here - keep REMOTE_ADDR in the list, see
      # .env.example for ready-made values) and re-run `docker compose up
      # -d`. Consumed via config/trustedproxy.php (full rationale there) -
      # Docker-only setting, bare host installs need nothing.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-REMOTE_ADDR}"
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - scart

  webserver:
    image: nginx:1.27-alpine
    container_name: scart-nginx-prod
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - scart

  queue:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
        INSTALL_XDEBUG: "false"
    image: scart-app:${PHP_VERSION:-8.3}-prod
    container_name: scart-queue-prod
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - scart

  scheduler:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
        INSTALL_XDEBUG: "false"
    image: scart-app:${PHP_VERSION:-8.3}-prod
    container_name: scart-scheduler-prod
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - scart

  # Optional dockerized MySQL for prod. Only starts with --profile db-local
  # (or COMPOSE_PROFILES=db-local). Skip entirely to use a remote/managed
  # database - just point DB_HOST at it in .env.
  mysql-local:
    image: mysql:8.4
    container_name: scart-mysql-local-prod
    profiles: ["db-local"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - scart-mysql-local-data-prod:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - scart

  # One-off container for building front-end assets. Not started by `up`
  # (profile "tools"); run manually when you need to rebuild assets:
  #   docker compose -f docker-compose.prod.yml run --rm node
  node:
    image: node:22-alpine
    container_name: scart-node-prod
    working_dir: /var/www/html
    profiles: ["tools"]
    # npm ci requires an existing package-lock.json; fall back to npm install
    # (which also generates one) when it's missing, e.g. on a fresh checkout.
    command: ["sh", "-c", "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build"]
    volumes:
      - ./:/var/www/html
      - scart-node-modules:/var/www/html/node_modules
    networks:
      - scart

networks:
  scart:
    driver: bridge

volumes:
  # Explicit `name:` pins below decouple volume identity from the `name:`
  # project setting above - changing the project name (scart -> scart-prod)
  # does not rename or orphan these, so any already-running prod deployment
  # keeps its existing MySQL data / vendor / node_modules volumes untouched.
  scart-vendor:
    name: scart-vendor
  scart-node-modules:
    name: scart-node-modules
  scart-mysql-local-data-prod:
    name: scart-mysql-local-data-prod
