name: scart

# =============================================================================
# DEV environment. Run with:  docker compose up -d --build
#
# For PRODUCTION use docker-compose.prod.yml instead:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The whole project directory is bind-mounted into the app/webserver
# containers (./:/var/www/html) instead of being COPYed into the image.
# That means:
#   - `git pull` on the host is immediately visible inside every container
#   - app/GP247, public/GP247, resources/views/vendor, storage/ all live on
#     the HOST filesystem and are never touched by an image rebuild -> no
#     data/customization loss, ever.
#
# vendor/ and node_modules/ are the two exceptions: they're overlaid with
# named Docker volumes (scart-vendor / scart-node-modules) instead of being
# bind-mounted from the host. They contain tens of thousands of small files
# (e.g. aws-sdk-php), and reading/writing that many files through a Windows
# bind-mount (Docker Desktop / WSL2 9p bridge) is slow enough to time out
# `composer install`. Using a native Docker volume keeps them fast, while
# still surviving container recreation/image rebuilds (only lost on
# `docker compose down -v`). You just can't browse them from the host.
# =============================================================================

services:
  app:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        # Hardcoded (not from .env): dev always runs the app container as
        # root - sidesteps all host bind-mount permission issues (WSL2
        # DrvFs, Linux UID mismatches...) uniformly, no per-user setup
        # needed. Prod uses a real non-root user instead - see
        # docker-compose.prod.yml.
        WWWUSER: "0"
        WWWGROUP: "0"
        INSTALL_XDEBUG: "true"
    image: scart-app:${PHP_VERSION:-8.3}
    container_name: scart-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    # Only variables entrypoint.sh's shell logic needs (DB wait-loop) plus
    # Docker-specific overrides go here. Deliberately NOT `env_file: .env` -
    # that would inject the whole .env (including APP_KEY etc.) as frozen
    # container env vars, which phpdotenv then refuses to ever overwrite from
    # the .env file again (even after `artisan key:generate` updates it).
    # Laravel reads the rest of .env itself on every request, no forwarding
    # needed.
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # "app" has no published port and only ever receives traffic from the
      # "webserver" container over the internal "scart" bridge network, so
      # trusting '*' here doesn't expose X-Forwarded-* spoofing to the
      # internet. Consumed via config/trustedproxy.php (see that file for
      # the full rationale) - Docker-only setting, bare host installs need
      # nothing.
      TRUSTED_PROXIES: "*"
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
      XDEBUG_CONFIG: client_host=host.docker.internal
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql-local}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-scart}
      DB_PASSWORD: ${DB_PASSWORD:-scart}
      # Hardcoded true to match WWWUSER=0/WWWGROUP=0 above (php-fpm refuses
      # to run root workers otherwise). Deliberately not wired into
      # docker-compose.prod.yml, so a prod WWWUSER=0 always fails loudly
      # instead of silently running as root.
      PHP_FPM_ALLOW_ROOT: "true"
    networks:
      - scart

  webserver:
    image: nginx:1.27-alpine
    container_name: scart-nginx
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scart

  queue:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WWWUSER: "0"
        WWWGROUP: "0"
        INSTALL_XDEBUG: "true"
    image: scart-app:${PHP_VERSION:-8.3}
    container_name: scart-queue
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql-local}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-scart}
      DB_PASSWORD: ${DB_PASSWORD:-scart}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - scart

  scheduler:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WWWUSER: "0"
        WWWGROUP: "0"
        INSTALL_XDEBUG: "true"
    image: scart-app:${PHP_VERSION:-8.3}
    container_name: scart-scheduler
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - ./:/var/www/html
      - scart-vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql-local}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-scart}
      DB_PASSWORD: ${DB_PASSWORD:-scart}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - scart

  # Dockerized local MySQL. Starts only when COMPOSE_PROFILES=db-local (the
  # .env.example default) or with `--profile db-local`. Point DB_HOST at
  # this service's name ("mysql-local") to use it; for a remote/managed DB,
  # unset COMPOSE_PROFILES and point DB_HOST at that server instead.
  mysql-local:
    image: mysql:8.4
    container_name: scart-mysql-local
    profiles: ["db-local"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-scart}
      MYSQL_USER: ${DB_USERNAME:-scart}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - scart-mysql-local-data-dev:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - scart

  # Always-on Vite dev server with HMR for local development.
  node:
    image: node:22-alpine
    container_name: scart-node
    working_dir: /var/www/html
    # npm ci requires an existing package-lock.json; fall back to npm install
    # (which also generates one) when it's missing, e.g. on a fresh checkout.
    command: ["sh", "-c", "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run dev -- --host 0.0.0.0"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - scart-node-modules:/var/www/html/node_modules
    networks:
      - scart

networks:
  scart:
    driver: bridge

volumes:
  scart-vendor:
  scart-node-modules:
  scart-mysql-local-data-dev:
