; ---- General -----------------------------------------------------------
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC

; ---- OPcache -------------------------------------------------------------
; validate_timestamps stays ON (even in production) so that a `git pull`
; on the host is picked up automatically without restarting containers.
; Lower revalidate_freq = fresher code, tiny extra stat() cost per request.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; ---- Sessions / uploads ----------------------------------------------------
session.gc_maxlifetime = 7200
; Off: GP247 never uses PHP's native session upload progress (Laravel manages
; sessions itself), and it is the advised mitigation for CVE-2026-115560 /
; the CVE-2026-109619 family (PHP2Shell) until a regular PHP release fixes it.
session.upload_progress.enabled = Off

; ---- Security ------------------------------------------------------------
; Off: the X-Powered-By version header only helps mass scanners pick targets.
expose_php = Off
