; ---- General -----------------------------------------------------------
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
max_input_vars = 5000
date.timezone = UTC

; ---- OPcache -------------------------------------------------------------
; validate_timestamps stays ON (even in production) so that a `git pull`
; on the host is picked up automatically without restarting containers.
; Lower revalidate_freq = fresher code, tiny extra stat() cost per request.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; ---- Sessions / uploads ----------------------------------------------------
session.gc_maxlifetime = 7200
